name: Windows bundles

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Distribution version, such as 0.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - flavor: standard
            flags: ''
          - flavor: cuda
            flags: '--cuda'
    runs-on: windows-2025
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install . huggingface-hub
      - run: python -m unittest discover -s tests -v
      - name: Stage and verify the distribution
        env:
          SUBTITLE_RELAY_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_FLAGS: ${{ matrix.flags }}
        run: python packaging\windows\build.py --native --verify-install %RELEASE_FLAGS%
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: windows-x64-*
          path: dist
          merge-multiple: true
      - name: Publish tagged GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.zip dist/*-SHA256.txt)
          if (( ${#files[@]} != 6 )); then
            echo "Expected two installers, two portable archives, and two checksum files." >&2
            exit 1
          fi
          options=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${options[@]}" "${files[@]}"
