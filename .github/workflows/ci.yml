name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: python (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - id: changes
        name: Check whether the PR changes only documentation
        if: github.event_name == 'pull_request'
        run: python tools/ci.py >> "$GITHUB_OUTPUT"
      - name: Validate bilingual documentation and Wiki navigation
        run: |
          python tools/check_docs.py
          python tools/wiki.py
      - if: steps.changes.outputs.docs_only != 'true'
        run: python -m pip install . huggingface-hub
      - if: steps.changes.outputs.docs_only != 'true'
        run: python -m compileall -q subtitle_relay packaging tools
      - if: steps.changes.outputs.docs_only != 'true'
        run: python -m unittest discover -s tests -v

  python:
    name: python (windows-2025)
    needs: linux
    if: ${{ !cancelled() && needs.linux.outputs.docs_only != 'true' }}
    timeout-minutes: 10
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install . huggingface-hub
      - run: python tools/check_docs.py
      - run: python tools/wiki.py
      - run: python -m compileall -q subtitle_relay packaging tools
      - run: python -m unittest discover -s tests -v

  desktop:
    needs: linux
    if: ${{ !cancelled() && needs.linux.outputs.docs_only != 'true' }}
    timeout-minutes: 10
    runs-on: windows-2025
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build desktop\LocalVideoSubtitleTranslator.csproj -c Release
      - run: dotnet run --project tests\desktop\UpdateChecks.csproj -c Release
      - run: dotnet desktop\bin\Release\net10.0-windows\AheadSubs.dll --render-preview previews\zh-CN zh-CN
      - run: dotnet desktop\bin\Release\net10.0-windows\AheadSubs.dll --render-preview previews\en-US en-US
