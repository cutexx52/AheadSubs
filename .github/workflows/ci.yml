name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install . huggingface-hub
      - run: python tools/check_docs.py
      - run: python -m compileall -q subtitle_relay packaging tools
      - run: python -m unittest discover -s tests -v

  desktop:
    timeout-minutes: 10
    runs-on: windows-2025
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build desktop\LocalVideoSubtitleTranslator.csproj -c Release
      - run: dotnet desktop\bin\Release\net10.0-windows\AheadSubs.dll --render-preview previews\zh-CN zh-CN
      - run: dotnet desktop\bin\Release\net10.0-windows\AheadSubs.dll --render-preview previews\en-US en-US
