[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-relay"
version = "0.1.0"
description = "Local video subtitle generation and translation with playback look-ahead"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.12,<3", "psutil>=6,<9; platform_system == 'Windows'"]

[project.scripts]
aheadsubs = "subtitle_relay.cli:main"

[project.optional-dependencies]
desktop = ["pystray>=0.19.5,<0.20; platform_system == 'Windows'"]
cloud = ["openai>=1.80,<4", "PyJWT[crypto]>=2.12,<3; platform_system == 'Windows'"]
local = ["faster-whisper>=1.2,<2", "ctranslate2>=4.5,<5", "huggingface-hub", "tokenizers"]
fsmn-vad = ["kaldi-native-fbank>=1.20,<2", "numpy", "onnxruntime>=1.16", "huggingface-hub"]
cuda12 = ["nvidia-cublas-cu12; platform_system == 'Windows'", "nvidia-cudnn-cu12>=9,<10; platform_system == 'Windows'"]

[tool.setuptools.packages.find]
include = ["subtitle_relay*"]
